[project]
name = "agentic-support"
version = "0.1.0"
description = "Agentic Support: multi-agent e-commerce customer service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "httpx>=0.27.0,<0.29",
    "sqlalchemy>=2.0.36,<2.1",
    "greenlet>=3.1.0,<4",
    "asyncpg>=0.30.0,<0.31",
    "aiosqlite>=0.20.0,<0.21",
    "alembic>=1.14.0,<1.15",
    "qdrant-client>=1.12.0,<1.13",
    "redis>=5.2.0,<6",
    "langgraph>=0.2.50,<0.3",
    "langchain-core>=0.3.20,<0.4",
    "rank-bm25>=0.2.2",
    "orjson>=3.10.0,<4",
    "python-json-logger>=2.0.7,<4",
    "tenacity>=9.0.0,<10",
    "prometheus-client>=0.21.0,<0.22",
    "sse-starlette>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "pytest-cov>=6.0.0,<7",
    "httpx>=0.27.0",
    "ruff>=0.8.0,<0.9",
    "mypy>=2.0,<3",
]
rerank = [
    "sentence-transformers>=3.1.0,<4",
    "modelscope>=1.20.0,<2",
]
docs = [
    "unstructured[md,pdf,docx,pptx]>=0.16.0,<1",
]

[project.scripts]
agentic-support-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # FastAPI idiom: dependency injection via parameter defaults; B008 is a false positive here.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Asserting "any exception" in tests is a common pattern.
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.11"
files = ["app", "eval"]
ignore_missing_imports = true
show_error_codes = true

# The Tool base class uses the template-method pattern: subclasses narrow execute's
# payload from BaseModel down to a concrete Input model. That is an LSP violation in
# strict type-theory terms, but it is safe in this framework (callers dispatch on the
# concrete type via the registry), so the override check is disabled. For strict
# checking, Tool should be made a generic Tool[P].
disable_error_code = ["override"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]
combine-as-imports = true
