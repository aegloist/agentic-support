services:
  api:
    build: .
    container_name: adaptive-rag
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/local/app.db
      REDIS_URL: ""
      QDRANT_URL: ""
      APP_ENV: production
      LOG_LEVEL: INFO
      AUTH_TOKENS: ${AUTH_TOKENS:?Set AUTH_TOKENS in .env before starting}
      LLM_API_KEY: ${LLM_API_KEY:-${DEEPSEEK_API_KEY:-}}
      LLM_BASE_URL: ${LLM_BASE_URL:-${DEEPSEEK_BASE_URL:-https://api.deepseek.com}}
      LLM_MODEL: ${LLM_MODEL:-${DEEPSEEK_MODEL:-deepseek-chat}}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small-en-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      LOCAL_EMBEDDING_ENABLED: "false"
      CROSS_ENCODER_ENABLED: "false"
      UNSTRUCTURED_ENABLED: "false"
    volumes:
      - adaptive-rag-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  adaptive-rag-data:
